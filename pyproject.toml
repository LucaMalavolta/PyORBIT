[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyorbit-package"
version = "12.0.0b0"
requires-python = ">=3.12"
description = "PyORBIT: a code for exoplanet orbital parameters and stellar activity"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Luca Malavolta", email = "luca.malavolta@unipd.it" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy==2.5.5",
    "numba==0.68.1",
    "scipy==1.18.1",
    "matplotlib>=3.11.2",
    "astropy>=8.0.3",
    "astroquery>=0.4.11",
    "pyerfa>=2.0.1.5",
    "emcee>=3.1.6",
    "pyyaml==6.0.4",
    "h5py==3.16.0",
    "tqdm==4.70.1",
    "pygtc==0.5.0",
    "jaxlib==0.12.1",
    "jax==0.12.1",
    "tinygp>=0.3.1",
    "ordered-set>=4.1.0",
    "packaging>=26.4",
    "celerite>=0.4.1",
    "pytransit>=2.12.0",
    "meepmeep>=1.2.1",
    "celerite2>=0.3.3",
    "george>=0.4.0",
    "dynesty>=3.1.0",
    "ultranest>=3.4.4",
    "uncertainties",
    "lmfit",
    "nautilus-sampler",
    "spleaf==2.1.20",
    "argparse",
    "cython",
    "pandas",
    "semantic-version",
    "schwimmbad",
    "arviz",
    "corner",
    "pyastronomy",
    "opencv-python",
    "zeus-mcmc",
]

[project.optional-dependencies]
# CUDA 12 build of the same JAX release used by the base dependencies.
gpu = [
    "jax[cuda12]==0.12.1",
    "ml-dtypes==0.7.0",
    "cupy-cuda12x>=14.2.0,<15",
    "jaxoplanet==0.2.0",
]

[project.urls]
Homepage = "https://github.com/LucaMalavolta/PyORBIT"

[project.scripts]
pyorbit_run = "pyorbit.pyorbit_run:pyorbit_run"
pyorbit_results = "pyorbit.pyorbit_results:pyorbit_results"

[tool.setuptools]
packages = [
    "pyorbit",
    "pyorbit.common",
    "pyorbit.classes",
    "pyorbit.models",
    "pyorbit.samplers",
    "pyorbit.subroutines",
]
zip-safe = false
